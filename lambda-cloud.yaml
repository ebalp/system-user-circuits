# Lambda Cloud configuration for lambda-cloud-toolkit
# Used by: lambda-gpu CLI and --backend lambda in run_experiments.py

ssh_key_name: "anusha-cre-lambda-key"
ssh_key_file: "~/.ssh/anusha-cre-lambda-key.pem"
repo_url: "https://github.com/ebalp/system-user-circuits.git"
repo_dir: "/home/ubuntu/system-user-circuits"  # derived from repo_url if omitted
# setup_script: "my-custom-setup.sh"  # optional extra setup after bootstrap
dependency_repos:
  - "https://github.com/ebalp/lambda-cloud-toolkit.git"

defaults:
  vllm_port: 8000
  vllm_venv_path: /home/ubuntu/vllm-venv
  max_launch_retries: 5
  launch_retry_delay: 60
  readiness_timeout: 900  # soft timeout; keeps waiting if vLLM process is alive

instance_preferences:
  - gpu_1x_a100
  - gpu_1x_a100_sxm4

model_gpu_map:
  meta-llama/Llama-3.1-8B-Instruct:
    instance_type: gpu_1x_a100
    instance_preferences:
      - gpu_1x_a100
      - gpu_1x_a100_sxm4
    vllm_args: "--max-model-len 4096"
  meta-llama/Llama-3.3-70B-Instruct:
    instance_type: gpu_8x_a100
    instance_preferences:
      - gpu_8x_h100_sxm5
      - gpu_8x_a100
      - gpu_8x_a100_sxm4
      - gpu_8x_a100_80gb_sxm4
      - gpu_8x_a10
    vllm_args: "--tensor-parallel-size 8 --max-model-len 4096"
  Qwen/Qwen2.5-7B-Instruct:
    instance_type: gpu_1x_a100_sxm4
    vllm_args: "--max-model-len 4096"
    instance_preferences:
      - gpu_1x_a100
      - gpu_1x_a100_sxm4
      - gpu_1x_a10
  google/gemma-3-27b-it:
    instance_type: gpu_8x_a100
    instance_preferences:
      - gpu_8x_a100
      - gpu_8x_a100_sxm4
      - gpu_8x_a100_80gb_sxm4
    vllm_args: "--tensor-parallel-size 8 --max-model-len 4096"
  openai/gpt-oss-20b:
    instance_type: gpu_1x_a100
    vllm_args: "--max-model-len 4096"
  _default:
    instance_type: gpu_1x_a100
    instance_preferences:
      - gpu_1x_a100
      - gpu_1x_a100_sxm4
    vllm_args: "--max-model-len 4096"

# S3-compatible storage (Lambda Filesystem)
# Credentials come from env vars: LAMBDA_ACCESS_KEY_ID, LAMBDA_SECRET_ACCESS_KEY
storage:
  bucket_name: fab66276-ba33-473e-aa1e-d03cab7d170d
  endpoint_url: https://files.us-east-2.lambda.ai
  region: us-east-2
  sync_dir: data            # default directory for lambda-gpu sync
  syncignore: .syncignore

# Config for build_conflict_dataset.py
# Dataset size = (number of WildChat prompts) × num_conflicts_per_prompt

# Paths relative to this config file's directory (works from repo root or from data/)
wildchat_path: "wildchat_filtered.jsonl"
output_path: "conflict_dataset.jsonl"

# N = number of different system-user conflicts to pair with each user prompt.
num_conflicts_per_prompt: 3

# Optional: cap number of WildChat prompts to use (default: use all)
# max_prompts: 1000

seed: 42
